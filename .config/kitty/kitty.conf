# 字体
bold_font     auto
font_family   JetBrainsMono Nerd Font
font_size     12.0
italic_font   auto
symbol_font   "OPPO Sans 4.0"

# 窗口配置
background_blur             32
background_opacity          0.79
dynamic_background_opacity  yes
hide_window_decorations     yes
window_padding_width        12

# 光标配置
cursor_blink_interval   1
cursor_shape            beam

# 鼠标和滚动
alternate_scroll  yes
click_url_button  1
detect_urls       yes
mouse_hide_wait   1
open_url_with     xdg-open
scrollback_lines  10000
mouse_map right   press   ungrabbed no_op
mouse_map right   drag    ungrabbed no_op
mouse_map right   release ungrabbed no_op
mouse_map right   release ungrabbed paste_from_clipboard
mouse_map middle  release ungrabbed paste_from_clipboard

# 配色: Tokyo Night
# 在终端用 `kitty +kitten themes` 修改主题

# 终端功能
copy_on_select          yes
shell_integration       enabled
strip_trailing_spaces   smart

# 按键绑定
map ctrl+0              change_font_size all 0
map ctrl+1              goto_tab 1
map ctrl+2              goto_tab 2
map ctrl+3              goto_tab 3
map ctrl+minus          change_font_size all -1.0
map ctrl+plus           change_font_size all +1.0
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+n        new_window
map ctrl+shift+v        paste_from_clipboard
map ctrl+w              close_tab

# 标签栏配置
active_tab_font_style         bold
active_tab_title_template     "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
inactive_tab_font_style       normal
tab_activity_symbol           " ● "
tab_bar_align                 left
tab_bar_edge                  top
tab_bar_margin_height         2.5 1.5
tab_bar_margin_width          0.0
tab_bar_min_tabs              2
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_title_template            "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# BEGIN_KITTY_THEME
# Grape
include current-theme.conf
# END_KITTY_THEME